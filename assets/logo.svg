<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-label="Griffin logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233B"/>
      <stop offset="1" stop-color="#6E45AE"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F6BD6"/>
      <stop offset="1" stop-color="#5FA8E8"/>
    </linearGradient>
  </defs>

  <rect width="560" height="220" rx="26" fill="url(#bg)"/>

  <!-- vector-space grid -->
  <g stroke="#8FB6E8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="40" y1="60"  x2="180" y2="60"/>
    <line x1="40" y1="110" x2="180" y2="110"/>
    <line x1="40" y1="160" x2="180" y2="160"/>
    <line x1="40" y1="60"  x2="40"  y2="160"/>
    <line x1="87" y1="60"  x2="87"  y2="160"/>
    <line x1="133" y1="60" x2="133" y2="160"/>
    <line x1="180" y1="60" x2="180" y2="160"/>
  </g>

  <!-- attribute groups -->
  <g fill="#F1E6F8" fill-opacity="0.9">
    <rect x="47" y="67"  width="33" height="36" rx="5"/>
    <rect x="94" y="117" width="33" height="36" rx="5"/>
    <rect x="141" y="67" width="33" height="36" rx="5"/>
  </g>

  <!-- query vector + neighborhood -->
  <circle cx="110" cy="110" r="30" fill="url(#dot)" fill-opacity="0.22"/>
  <circle cx="110" cy="110" r="6"  fill="#EAF2FF"/>
  <circle cx="92"  cy="95"  r="3.5" fill="#9CC4F0"/>
  <circle cx="128" cy="98"  r="3.5" fill="#9CC4F0"/>
  <circle cx="96"  cy="126" r="3.5" fill="#9CC4F0"/>
  <circle cx="126" cy="124" r="3.5" fill="#9CC4F0"/>

  <text x="210" y="104" font-family="Georgia, 'Times New Roman', serif"
        font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Griffin</text>
  <text x="212" y="138" font-family="Helvetica, Arial, sans-serif"
        font-size="15" fill="#D8CCEE">Customizable attribute--vector data</text>
  <text x="212" y="160" font-family="Helvetica, Arial, sans-serif"
        font-size="15" fill="#D8CCEE">and FANNS workloads for ICDE</text>
</svg>
